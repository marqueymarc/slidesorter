name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
