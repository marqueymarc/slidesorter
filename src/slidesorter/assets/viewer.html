<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Viewer · SlideSorter</title><link rel="stylesheet" href="/gallery/app.css?v=3.3.2"></head><body><main class="viewer-shell"><div class="page-top"><a class="brand-wordmark" href="/gallery/" target="_blank" rel="noopener" aria-label="Open a new SlideSorter gallery tab">SlideSorter</a><span class="summary" id="hint"></span></div><h1 class="viewer-title" id="name">Media viewer</h1><p class="viewer-path" id="path"></p><div id="media"></div><p class="viewer-error" id="error"></p></main><footer class="app-footer" aria-label="Application version">SlideSorter v3.3.2</footer><script>const p=new URLSearchParams(location.search),id=p.get("id"),kind=p.get("kind"),host=document.querySelector("#media"),error=document.querySelector("#error");if(!id){error.textContent="Missing media path"}else{const name=id.split("/").pop();document.querySelector("#name").textContent=name;document.title=`${name} · SlideSorter`;document.querySelector("#path").textContent=id;const src=`/media/${id.split("/").map(encodeURIComponent).join("/")}`;if(kind==="picture"){const img=document.createElement("img");img.className="viewer-media";img.alt=name;img.src=src;host.append(img)}else{const video=document.createElement("video");video.className="viewer-media";video.controls=true;video.autoplay=true;video.preload="metadata";video.src=src;host.append(video);document.querySelector("#hint").textContent="Space · play/pause";video.play().catch(()=>error.textContent="Playback is ready; use the play control if automatic sound is blocked");document.addEventListener("keydown",event=>{if(event.code!=="Space"||event.target.matches("input,textarea,button,a,select"))return;event.preventDefault();video.paused?video.play():video.pause()})}}</script></body></html>
