<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Viewer · SlideSorter</title>
  <link rel="icon" href="/gallery/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gallery/app.css?v=3.9.0-ui6">
  <script src="/gallery/appearance.js?v=3.9.0"></script>
</head>
<body>
  <main class="viewer-shell">
    <div class="page-top"><a class="brand-wordmark" href="/gallery/" target="_blank" rel="noopener" aria-label="Open a new SlideSorter gallery tab">SlideSorter</a><span class="summary" id="hint"></span></div>
    <h1 class="viewer-title" id="name">Media viewer</h1>
    <p class="viewer-path" id="path"></p>
    <div id="media"></div>
    <p class="viewer-error" id="error"></p>
  </main>
  <footer class="app-footer" aria-label="Application version">SlideSorter v3.9.0</footer>
  <script>
    const parameters = new URLSearchParams(location.search);
    const id = parameters.get("id");
    const kind = parameters.get("kind");
    const returnToken = parameters.get("return_token");
    const host = document.querySelector("#media");
    const error = document.querySelector("#error");
    if (returnToken) document.querySelector(".brand-wordmark").href = `/gallery/?return_token=${encodeURIComponent(returnToken)}`;
    if (!id) {
      error.textContent = "Missing media path";
    } else {
      const name = id.split("/").pop();
      document.querySelector("#name").textContent = name;
      document.title = `${name} · SlideSorter`;
      document.querySelector("#path").textContent = id;
      const source = `/media/${id.split("/").map(encodeURIComponent).join("/")}`;
      if (kind === "picture") {
        const image = document.createElement("img");
        image.className = "viewer-media";
        image.alt = name;
        image.src = source;
        host.append(image);
      } else {
        const video = document.createElement("video");
        video.className = "viewer-media";
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.src = source;
        host.append(video);
        document.querySelector("#hint").textContent = "Space · play/pause";
        video.play().catch(() => error.textContent = "Playback is ready; use the play control if automatic sound is blocked");
        document.addEventListener("keydown", event => {
          if (event.code !== "Space" || event.target.matches("input,textarea,button,a,select")) return;
          event.preventDefault();
          video.paused ? video.play() : video.pause();
        });
      }
    }
  </script>
</body>
</html>
