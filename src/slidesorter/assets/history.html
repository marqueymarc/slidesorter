<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>History · SlideSorter</title>
  <link rel="icon" href="/gallery/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gallery/app.css?v=3.9.3-ui8">
  <script src="/gallery/appearance.js?v=3.9.3"></script>
</head>
<body>
  <main class="history-shell">
    <div class="page-top">
      <nav class="history-nav" aria-label="SlideSorter navigation">
        <a class="brand-wordmark" href="/gallery/" target="_blank" rel="noopener" aria-label="Open a new SlideSorter gallery tab">SlideSorter</a>
        <a class="back" id="history-back" href="/gallery/">← Back to SlideSorter</a>
      </nav>
      <div class="page-actions"><button class="control utility" id="history-refresh" type="button">Refresh view</button><button class="control utility undo-last" id="history-undo-last" type="button" disabled>↶ Undo latest batch</button></div>
    </div>
    <header class="page-intro"><p class="eyebrow">Move journal</p><h1>History</h1><p>Undo one item from its row, or restore a whole batch from its batch bar.</p></header>
    <section class="history-list" id="history-list" aria-live="polite"></section>
  </main>
  <footer class="app-footer" aria-label="Application version">SlideSorter v3.9.3</footer>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script src="/gallery/history.js?v=3.9.3" defer></script>
</body>
</html>
